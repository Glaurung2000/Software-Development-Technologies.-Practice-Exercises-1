name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "development", "release" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run tests (Проверка текста)
      run: |
        echo "Запуск тестов..."
        if find . -name "*.txt" -size 0 | grep -q .; then
          echo "Ошибка: Найдены пустые txt файлы!"
          exit 1
        fi
        echo "Все тесты пройдены успешно."

    - name: Build project (Сборка)
      run: |
        echo "Сборка проекта..."
        mkdir build
        cp *.txt build/ 2>/dev/null || echo "Нет txt файлов"
        echo "Сборка завершена."

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-text-build
        path: build/

    # --- АВТОМАТИЧЕСКАЯ ГЕНЕРАЦИЯ ДОКУМЕНТАЦИИ ---
    - name: Update Documentation (Обновление документации)
      run: |
        echo "Обновление README.md..."
        # Добавляем строку в README
        echo "" >> README.md
        echo "---" >> README.md
        echo "**Автоматическое обновление:** Документация обновлена CI/CD $(date '+%Y-%m-%d %H:%M:%S')" >> README.md
        
        # Настраиваем Git (обязательно для ботов)
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        
        # Коммитим и пушим изменения
        git add README.md
        git commit -m "docs: автообновление документации [skip ci]"
        git push
